<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Lax Drills</title>
<style>/*@CSS@*/</style>
</head>
<body>
<svg id="sprites" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<!--@SPRITES@-->
</svg>

<header id="topbar">
  <h1>Visual Lax Drills <span class="ver">@VERSION@</span></h1>
  <label class="pick">Drill
    <select id="drill"></select>
  </label>
  <label class="pick" id="variant-pick" hidden>Version
    <select id="variant"></select>
  </label>
  <label class="pick" id="take-pick" hidden>Seed
    <select id="take"></select>
  </label>
  <label class="pick">Theme
    <select id="theme"></select>
  </label>
</header>

<main id="app">
  <section id="stage" aria-label="Drill field">
    <svg id="field" role="img" aria-label="Lacrosse half field with the drill playing"></svg>
  </section>
  <section id="panel" aria-label="Drill details and controls">
    <h2 id="title"></h2>
    <p id="summary"></p>
    <p id="caption" aria-live="polite"></p>
    <div id="controls">
      <button id="play" type="button" class="primary">Play</button>
      <button id="reset" type="button">Reset</button>
      <input id="scrub" type="range" min="0" max="600" step="1" value="0" aria-label="Drill timeline">
      <span id="time" class="time"></span>
      <label class="pick">Speed
        <select id="speed"></select>
      </label>
    </div>
  </section>
</main>

<script>/*@JS@*/</script>
</body>
</html>
